pattern: ~/.codex
classification: Codex persistent state/history
category: Application data
risk: Low
explanation: |
  Codex stores persistent state, sessions, history, and package data under this directory.
recommendation: Do not treat ~/.codex as disposable cache; inspect subdirectories before removing anything.
---
pattern: ~/.codex/packages
classification: Application releases
category: Application releases
risk: Low
explanation: |
  Codex stores complete standalone releases. Multiple retained versions are expected after updates.
recommendation: Review retained Codex releases.
